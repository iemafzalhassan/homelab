# golangci-lint v2 config.
# Migrated from the v1 schema on 2026-07-15 — the v1 schema is no longer
# supported by golangci-lint >= 2.0. See:
#   https://golangci-lint.run/product/migration-guide/
#
# Notes for v2:
#  - errcheck, govet, ineffassign, staticcheck, unused are enabled by default.
#  - `gosimple` was folded into `staticcheck`; do not enable it separately.
#  - gofmt is a formatter, not a linter — it lives under `formatters:`.
version: "2"
linters:
  enable:
    - gosec
    - misspell
  settings:
    gosec:
      excludes:
        - G204
formatters:
  enable:
    - gofmt
