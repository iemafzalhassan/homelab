name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: kyros/
  
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - run: go test ./...
        working-directory: kyros/
  
  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - run: go build ./...
        working-directory: kyros/
  
  # Web lint is intentionally not run yet: the web app has no ESLint setup
  # (no eslint config, no lint script in apps/web/package.json), and
  # Next.js 16 REMOVED `next lint` entirely. Add this job back when a flat
  # ESLint config is added to apps/web/. See kyros/.github/ISSUE_TEMPLATE
  # or open an issue: "Add ESLint flat config to apps/web".
  web-lint:
    runs-on: ubuntu-latest
    needs: [go-build]
    steps:
      - uses: actions/checkout@v4
      - run: echo "Web lint not yet configured — Next 16 removed next lint and the app has no ESLint setup. Skipping." && exit 0

  web-build:
    runs-on: ubuntu-latest
    needs: [go-build]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.0.0' }
      - run: bun install --frozen-lockfile
        working-directory: kyros/
      # Use `npx next build` (not `bun --filter web build` or `bunx`) so
      # we don't depend on bun's workspace filter, which has bugs on
      # certain working-directory shapes (e.g. iCloud-synced paths with
      # spaces). `npx` is bundled with the ubuntu runner and `next` is
      # installed as a workspace dependency.
      - run: npx --no-install next build
        working-directory: kyros/apps/web/
  
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, registry, scanner, sbom, signer, builder, notifier]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: kyros/
          file: kyros/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
          push: false
          tags: kyros/${{ matrix.service }}:ci
