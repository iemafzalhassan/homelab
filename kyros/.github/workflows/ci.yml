name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: kyros/
  
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - run: go test ./...
        working-directory: kyros/
  
  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - run: go build ./...
        working-directory: kyros/
  
  web-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.0.0' }
      - run: bun install
        working-directory: kyros/
      - run: bun lint
        working-directory: kyros/
  
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.0.0' }
      - run: bun install && bun --filter web build
        working-directory: kyros/
  
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, registry, scanner, sbom, signer, builder, notifier]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: kyros/
          file: kyros/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
          push: false
          tags: kyros/${{ matrix.service }}:ci
