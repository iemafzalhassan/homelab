apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-demo-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/iemafzalhassan/homelab.git'
    targetRevision: HEAD
    path: manifests/apps/opentelemetry-demo/prod
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: demo-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
