apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo-prod
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      tolerations:
        - key: "kubernetes.azure.com/scalesetpriority"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"
      containers:
        - name: frontend
          image: ghcr.io/open-telemetry/demo:latest-frontend
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: otel-demo-config
          env:
            - name: FRONTEND_PORT
              value: "3000"
            - name: OTEL_SERVICE_NAME
              value: frontend
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo-prod
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: demo-prod
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: otel-demo-prod.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
