apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://open-telemetry.github.io/opentelemetry-helm-charts'
    chart: opentelemetry-demo
    targetRevision: 0.34.0
    helm:
      valuesObject:
        default:
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://k8s-monitoring-alloy-receiver.monitoring.svc:4318"
        prometheus:
          enabled: false
        grafana:
          enabled: false
        jaeger:
          enabled: false
        opentelemetry-collector:
          enabled: true
          config:
            exporters:
              otlphttp/alloy:
                endpoint: "http://k8s-monitoring-alloy-receiver.monitoring.svc:4318"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: otel-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
