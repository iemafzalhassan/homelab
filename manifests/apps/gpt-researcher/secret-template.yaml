apiVersion: v1
kind: Secret
metadata:
  name: gpt-researcher-secrets
  namespace: gpt-researcher
type: Opaque
stringData:
  # NOTE: Replace these with your actual keys before applying, or use SealedSecrets
  TAVILY_API_KEY: "tvly-your-key-here"
  # Using Ollama internally, so OpenAI key is not strictly required if we set the model provider correctly, 
  # but sometimes the library requires it to be set to a dummy value.
  OPENAI_API_KEY: "dummy-key-for-ollama"
