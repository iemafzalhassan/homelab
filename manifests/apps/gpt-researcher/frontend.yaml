apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpt-researcher-frontend
  namespace: gpt-researcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpt-researcher-frontend
  template:
    metadata:
      labels:
        app: gpt-researcher-frontend
    spec:
      containers:
      - name: frontend
        image: gptresearcher/gptr-nextjs:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_GPTR_API_URL
          # For browser-side fetching, this needs to be the public URL exposed via Ingress
          value: "https://research-api.smapatticare.com"
        volumeMounts:
        - name: data-volume
          mountPath: /app/outputs
          subPath: outputs
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: gpt-researcher-data
---
apiVersion: v1
kind: Service
metadata:
  name: gpt-researcher-frontend
  namespace: gpt-researcher
spec:
  type: ClusterIP
  selector:
    app: gpt-researcher-frontend
  ports:
  - port: 3000
    targetPort: 3000
