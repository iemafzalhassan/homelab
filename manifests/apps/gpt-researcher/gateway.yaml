apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gpt-researcher-ui
  namespace: gpt-researcher
spec:
  parentRefs:
  - name: traefik
    namespace: traefik
  hostnames:
  - "research.smapatticare.com"
  rules:
  - backendRefs:
    - name: gpt-researcher-frontend
      port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gpt-researcher-api
  namespace: gpt-researcher
spec:
  parentRefs:
  - name: traefik
    namespace: traefik
  hostnames:
  - "research-api.smapatticare.com"
  rules:
  - backendRefs:
    - name: gpt-researcher-backend
      port: 8000
