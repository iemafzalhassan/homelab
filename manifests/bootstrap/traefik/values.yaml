image:
  tag: v3.7.6

providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true

gateway:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All
    websecure:
      port: 8443
      protocol: HTTPS
      hostname: "argocd.smapatticare.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: argocd-tls-secret
      allowedRoutes:
        namespaces:
          from: All
    authsecure:
      port: 8443
      protocol: HTTPS
      hostname: "auth.smapatticare.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: smapatticare-tls
            namespace: default
      allowedRoutes:
        namespaces:
          from: All
    jenkins:
      port: 8443
      protocol: HTTPS
      hostname: "jenkins.smapatticare.com"
      namespacePolicy:
        from: All
      mode: Terminate
      certificateRefs:
        - kind: Secret
          name: jenkins-tls-secret
    keycloak:
      port: 8443
      protocol: HTTPS
      hostname: "sso.smapatticare.com"
      namespacePolicy:
        from: All
      mode: Terminate
      certificateRefs:
        - kind: Secret
          name: sso-tls-secret

serviceAccountAnnotations:
  azure.workload.identity/client-id: "fea8dd93-be15-4804-a790-b200eda1bae5"
  azure.workload.identity/tenant-id: "b8eee1de-0853-417c-9dc9-c90794eb2751"

deployment:
  podLabels:
    azure.workload.identity/use: "true"

nodeSelector:
  kubernetes.azure.com/scalesetpriority: "spot"
tolerations:
  - key: "kubernetes.azure.com/scalesetpriority"
    operator: "Equal"
    value: "spot"
    effect: "NoSchedule"

service:
  type: LoadBalancer
  spec:
    externalTrafficPolicy: Local

accessLog:
  enabled: true
  format: json

metrics:
  prometheus:
    enabled: true
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    service:
      enabled: true
