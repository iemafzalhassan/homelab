providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true

gateway:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All
    websecure:
      port: 8443
      protocol: HTTPS
      hostname: "argocd.smapatticare.com"
      namespacePolicy:
        from: All
      mode: Terminate
      certificateRefs:
        - kind: Secret
          name: argocd-tls-secret
    jenkins:
      port: 8443
      protocol: HTTPS
      hostname: "jenkins.smapatticare.com"
      namespacePolicy:
        from: All
      mode: Terminate
      certificateRefs:
        - kind: Secret
          name: jenkins-tls-secret

serviceAccountAnnotations:
  azure.workload.identity/client-id: "fea8dd93-be15-4804-a790-b200eda1bae5"
  azure.workload.identity/tenant-id: "b8eee1de-0853-417c-9dc9-c90794eb2751"

deployment:
  podLabels:
    azure.workload.identity/use: "true"

tolerations:
  - key: "CriticalAddonsOnly"
    operator: "Exists"
    effect: "NoSchedule"

service:
  type: LoadBalancer
  spec:
    externalTrafficPolicy: Local

accessLog:
  enabled: true
  format: json

metrics:
  prometheus:
    enabled: true
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    service:
      enabled: true
