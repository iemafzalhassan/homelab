apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: keycloak
spec:
  instances: 1
  storage:
    size: 10Gi
    storageClass: managed-csi
  # System Node Targeting - stable, no spot eviction
  affinity:
    nodeSelector:
      kubernetes.azure.com/mode: "system"
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"
        effect: "NoSchedule"
  bootstrap:
    initdb:
      database: keycloak
      owner: app
