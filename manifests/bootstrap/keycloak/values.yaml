auth:
  adminUser: admin
  adminPassword: "HomelabAdmin123!"

proxyHeaders: "xforwarded"
proxy: edge

production: true

ingress:
  enabled: false

# Spot Node Tolerations
nodeSelector:
  kubernetes.azure.com/scalesetpriority: "spot"
tolerations:
  - key: "kubernetes.azure.com/scalesetpriority"
    operator: "Equal"
    value: "spot"
    effect: "NoSchedule"

postgresql:
  enabled: false

externalDatabase:
  host: keycloak-db-rw
  user: app
  database: keycloak
  existingSecret: keycloak-db-app
  existingSecretPasswordKey: password

image:
  registry: docker.io
  repository: bitnamilegacy/keycloak
