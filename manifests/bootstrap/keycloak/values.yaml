auth:
  adminUser: admin
  adminPassword: "HomelabAdmin123!"

proxyHeaders: "xforwarded"
proxy: edge

production: true

ingress:
  enabled: false

# System Node scheduling - stable, no spot eviction risk
nodeSelector:
  kubernetes.azure.com/mode: "system"
tolerations:
  - key: "CriticalAddonsOnly"
    operator: "Exists"
    effect: "NoSchedule"

postgresql:
  enabled: false

externalDatabase:
  host: keycloak-db-rw
  user: app
  database: keycloak
  existingSecret: keycloak-db-app
  existingSecretPasswordKey: password

image:
  registry: docker.io
  repository: bitnamilegacy/keycloak
