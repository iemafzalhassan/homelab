apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-cloud-token-mounter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-cloud-token-mounter
  template:
    metadata:
      labels:
        app: grafana-cloud-token-mounter
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: k8s-monitoring-kube-state-metrics
      nodeSelector:
        kubernetes.azure.com/mode: "system"
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
        - name: mounter
          image: mcr.microsoft.com/oss/kubernetes/pause:3.6
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "grafana-cloud-token"
