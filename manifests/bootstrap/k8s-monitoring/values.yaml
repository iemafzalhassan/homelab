cluster:
  name: homelab-aks

destinations:
  grafana-cloud-metrics:
    type: prometheus
    url: https://prometheus-prod-43-prod-ap-south-1.grafana.net/api/prom/push
    secret:
      create: false
      name: grafana-cloud-metrics-credentials
    auth:
      type: basic
      username: "3347824"
  grafana-cloud-logs:
    type: loki
    url: https://logs-prod-028.grafana.net/loki/api/v1/push
    secret:
      create: false
      name: grafana-cloud-logs-credentials
    auth:
      type: basic
      username: "1669587"
  gc-otlp-endpoint:
    type: otlp
    url: https://otlp-gateway-prod-ap-south-1.grafana.net/otlp
    protocol: http
    secret:
      create: false
      name: grafana-cloud-otlp-credentials
    auth:
      type: basic
      username: "1711800"
    metrics:
      enabled: true
    logs:
      enabled: true
    traces:
      enabled: true
  grafana-cloud-profiles:
    type: pyroscope
    url: https://profiles-prod-018.grafana.net:443
    secret:
      create: false
      name: grafana-cloud-otlp-credentials
    auth:
      type: basic
      username: "1711800"

clusterMetrics:
  enabled: true
  collector: alloy-metrics
hostMetrics:
  enabled: true
  collector: alloy-metrics
  linuxHosts:
    enabled: true
  windowsHosts:
    enabled: false
  energyMetrics:
    enabled: true
costMetrics:
  enabled: true
  collector: alloy-metrics
annotationAutodiscovery:
  enabled: true
  collector: alloy-metrics
prometheusOperatorObjects:
  enabled: true
  collector: alloy-metrics
clusterEvents:
  enabled: true
  collector: alloy-singleton
nodeLogs:
  enabled: true
  collector: alloy-logs
podLogsViaLoki:
  enabled: true
  collector: alloy-logs
kubernetesManifests:
  enabled: true
  collector: alloy-singleton
applicationObservability:
  enabled: true
  collector: alloy-receiver
  receivers:
    otlp:
      grpc:
        enabled: true
        port: 4317
      http:
        enabled: true
        port: 4318
    zipkin:
      enabled: true
      port: 9411
autoInstrumentation:
  enabled: true
  collector: alloy-metrics
  beyla:
    deliverTracesToApplicationObservability: false
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    k8sCache:
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
profiling:
  enabled: true
  collector: alloy-profiles
  ebpf:
    enabled: true

collectors:
  alloy-metrics:
    presets:
      - clustered
      - statefulset
  alloy-singleton:
    presets:
      - singleton
  alloy-logs:
    presets:
      - filesystem-log-reader
      - daemonset
  alloy-receiver:
    presets:
      - deployment
  alloy-profiles:
    presets:
      - privileged
      - daemonset

collectorCommon:
  alloy:
    serviceAccount:
      annotations:
        azure.workload.identity/client-id: "fbec24a9-4d43-4c32-8a4a-f1e8056e8736"
    controller:
      podAnnotations:
        kubernetes.azure.com/set-kube-service-host-fqdn: "true"
      podLabels:
        azure.workload.identity/use: "true"
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
    remoteConfig:
      enabled: true
      url: https://fleet-management-prod-018.grafana.net
      secret:
        create: false
        name: grafana-cloud-otlp-credentials
      auth:
        type: basic
        username: "1711800"

telemetryServices:
  kube-state-metrics:
    deploy: true
    serviceAccount:
      annotations:
        azure.workload.identity/client-id: "fbec24a9-4d43-4c32-8a4a-f1e8056e8736"
    podAnnotations:
      kubernetes.azure.com/set-kube-service-host-fqdn: "true"
    podLabels:
      azure.workload.identity/use: "true"
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    volumes:
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "grafana-cloud-token"
    volumeMounts:
      - name: secrets-store-inline
        mountPath: "/mnt/secrets-store"
        readOnly: true
  node-exporter:
    deploy: true
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
  windows-exporter:
    deploy: false
  opencost:
    deploy: true
    metricsSource: grafana-cloud-metrics
    opencost:
      exporter:
        defaultClusterId: homelab-aks
      prometheus:
        existingSecretName: grafana-cloud-metrics-credentials
        password_key: password
        external:
          url: https://prometheus-prod-43-prod-ap-south-1.grafana.net/api/prom
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
    podAnnotations:
      kubernetes.azure.com/set-kube-service-host-fqdn: "true"
  kepler:
    deploy: true
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
  k8s-manifest-tail:
    deploy: true
    config:
      objects:
        - apiVersion: v1
          kind: Pod
        - apiVersion: apps/v1
          kind: Deployment
        - apiVersion: apps/v1
          kind: StatefulSet
        - apiVersion: apps/v1
          kind: DaemonSet
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

extraObjects:
  - apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: grafana-cloud-token
      namespace: monitoring
    spec:
      provider: azure
      secretObjects:
      - secretName: grafana-cloud-metrics-credentials
        type: Opaque
        data:
        - key: password
          objectName: grafana-cloud-token
        - key: username
          objectName: grafana-metrics-username
      - secretName: grafana-cloud-logs-credentials
        type: Opaque
        data:
        - key: password
          objectName: grafana-cloud-token
        - key: username
          objectName: grafana-logs-username
      - secretName: grafana-cloud-otlp-credentials
        type: Opaque
        data:
        - key: password
          objectName: grafana-cloud-token
        - key: username
          objectName: grafana-otlp-username
      parameters:
        usePodIdentity: "false"
        useVMManagedIdentity: "false"
        clientID: "fbec24a9-4d43-4c32-8a4a-f1e8056e8736"
        keyvaultName: "homelab-kv-etnr"
        cloudName: "AzurePublicCloud"
        objects: |
          array:
            - |
              objectName: grafana-cloud-token
              objectType: secret
              objectVersion: ""
            - |
              objectName: grafana-metrics-username
              objectType: secret
              objectVersion: ""
            - |
              objectName: grafana-logs-username
              objectType: secret
              objectVersion: ""
            - |
              objectName: grafana-otlp-username
              objectType: secret
              objectVersion: ""
        tenantId: "b8eee1de-0853-417c-9dc9-c90794eb2751"

beyla:
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  k8sCache:
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

alloy-operator:
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  waitForAlloyRemoval:
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
