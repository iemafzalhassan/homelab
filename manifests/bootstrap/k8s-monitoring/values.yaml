cluster:
  name: homelab-aks

externalServices:
  prometheus:
    host: "https://prometheus-prod-43-prod-ap-south-1.grafana.net"
    basicAuth:
      username: "3347824"
    secret:
      name: "grafana-cloud-credentials"
      namespace: "monitoring"
  loki:
    host: "https://logs-prod-028.grafana.net"
    basicAuth:
      username: "1669587"
    secret:
      name: "grafana-cloud-credentials"
      namespace: "monitoring"

metrics:
  enabled: true
  cost:
    enabled: true
  kepler:
    enabled: false
  alloy:
    metricsTuning:
      useIntegrationAllowList: true
      excludeMetrics: []

logs:
  enabled: true
  pod_logs:
    enabled: true
  cluster_events:
    enabled: true

traces:
  enabled: false
receivers:
  grpc:
    enabled: false
  http:
    enabled: false
  zipkin:
    enabled: false

alloy:
  serviceAccount:
    create: true
    name: "k8s-monitoring-alloy"
    annotations:
      azure.workload.identity/client-id: "fbec24a9-4d43-4c32-8a4a-f1e8056e8736"
  alloy:
    extraVolumes:
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "grafana-cloud-token"
    extraVolumeMounts:
      - name: secrets-store-inline
        mountPath: "/mnt/secrets-store"
        readOnly: true
  controller:
    podLabels:
      azure.workload.identity/use: "true"
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

configValidator:
  enabled: false

kube-state-metrics:
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

opencost:
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

alloy-events:
  controller:
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

test:
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"


extraObjects:
  - apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: grafana-cloud-token
      namespace: monitoring
    spec:
      provider: azure
      secretObjects:
      - secretName: grafana-cloud-credentials
        type: Opaque
        data:
        - key: password
          objectName: grafana-cloud-token
      parameters:
        usePodIdentity: "false"
        useVMManagedIdentity: "false"
        clientID: "fbec24a9-4d43-4c32-8a4a-f1e8056e8736"
        keyvaultName: "homelab-kv-etnr"
        cloudName: "AzurePublicCloud"
        objects: |
          array:
            - |
              objectName: grafana-cloud-token
              objectType: secret
              objectVersion: ""
        tenantId: "b8eee1de-0853-417c-9dc9-c90794eb2751"

