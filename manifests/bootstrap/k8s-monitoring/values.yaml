cluster:
  name: homelab-aks

destinations:
  prometheus:
    type: prometheus
    url: http://prometheus-server.monitoring.svc.cluster.local:80/api/v1/write
  loki:
    type: loki
    url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
  otlp:
    type: otlp
    url: http://tempo.monitoring.svc.cluster.local:4318
    protocol: http
    metrics:
      enabled: false
    logs:
      enabled: false
    traces:
      enabled: true

clusterMetrics:
  enabled: true
  collector: alloy-metrics
hostMetrics:
  enabled: false
  collector: alloy-metrics
  linuxHosts:
    enabled: true
  windowsHosts:
    enabled: false
  energyMetrics:
    enabled: false
costMetrics:
  enabled: false
  collector: alloy-metrics
annotationAutodiscovery:
  enabled: true
  collector: alloy-metrics
prometheusOperatorObjects:
  enabled: true
  collector: alloy-metrics
clusterEvents:
  enabled: true
  collector: alloy-singleton
nodeLogs:
  enabled: true
  collector: alloy-logs
podLogsViaLoki:
  enabled: true
  collector: alloy-logs
kubernetesManifests:
  enabled: false
  collector: alloy-singleton
applicationObservability:
  enabled: true
  collector: alloy-receiver
  receivers:
    otlp:
      grpc:
        enabled: true
        port: 4317
      http:
        enabled: true
        port: 4318
    zipkin:
      enabled: true
      port: 9411
autoInstrumentation:
  enabled: false
profiling:
  enabled: false

collectors:
  alloy-metrics:
    presets:
      - clustered
      - statefulset
    controller:
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
        - key: "kubernetes.azure.com/scalesetpriority"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"
  alloy-singleton:
    presets:
      - singleton
    controller:
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
        - key: "kubernetes.azure.com/scalesetpriority"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"
  alloy-logs:
    presets:
      - filesystem-log-reader
      - daemonset
    controller:
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
        - key: "kubernetes.azure.com/scalesetpriority"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"
  alloy-receiver:
    presets:
      - deployment
    controller:
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
        - key: "kubernetes.azure.com/scalesetpriority"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"
  alloy-profiles:
    enabled: false
    presets:
      - privileged
      - daemonset

collectorCommon:
  alloy:
    serviceAccount:
      annotations:
        azure.workload.identity/client-id: "fbec24a9-4d43-4c32-8a4a-f1e8056e8736"
    controller:
      podAnnotations:
        kubernetes.azure.com/set-kube-service-host-fqdn: "true"
      podLabels:
        azure.workload.identity/use: "true"
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
        - key: "kubernetes.azure.com/scalesetpriority"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"

alloy-logs:
  controller:
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "kubernetes.azure.com/scalesetpriority"
        operator: "Equal"
        value: "spot"
        effect: "NoSchedule"

alloy-metrics:
  controller:
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "kubernetes.azure.com/scalesetpriority"
        operator: "Equal"
        value: "spot"
        effect: "NoSchedule"

alloy-singleton:
  controller:
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "kubernetes.azure.com/scalesetpriority"
        operator: "Equal"
        value: "spot"
        effect: "NoSchedule"

alloy-receiver:
  controller:
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "kubernetes.azure.com/scalesetpriority"
        operator: "Equal"
        value: "spot"
        effect: "NoSchedule"
    volumeMounts:
      extra:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
    remoteConfig:
      enabled: false

telemetryServices:
  kube-state-metrics:
    deploy: true
    serviceAccount:
      annotations:
        azure.workload.identity/client-id: "fbec24a9-4d43-4c32-8a4a-f1e8056e8736"
    podAnnotations:
      kubernetes.azure.com/set-kube-service-host-fqdn: "true"
    podLabels:
      azure.workload.identity/use: "true"
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

  node-exporter:
    deploy: false
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
  windows-exporter:
    deploy: false
  opencost:
    deploy: false
  kepler:
    deploy: false
  k8s-manifest-tail:
    deploy: false
    config:
      objects:
        - apiVersion: v1
          kind: Pod
        - apiVersion: apps/v1
          kind: Deployment
        - apiVersion: apps/v1
          kind: StatefulSet
        - apiVersion: apps/v1
          kind: DaemonSet
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"


beyla:
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  k8sCache:
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

alloy-operator:
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  waitForAlloyRemoval:
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

alloy-metrics:
  alloy:
    extraConfig: |
      // ── ArgoCD native metrics ──────────────────────────────
      prometheus.scrape "argocd_native" {
        targets = [
          // application-controller (argocd_app_*, argocd_reconcile_*)
          { __address__ = "argocd-application-controller-metrics.argocd.svc.cluster.local:8082", job = "argocd/application-controller" },
          // server (argocd_login_request_total, grpc_server_*)
          { __address__ = "argocd-server-metrics.argocd.svc.cluster.local:8083", job = "argocd/server" },
          // repo-server (argocd_git_request_*, argocd_repo_*)
          { __address__ = "argocd-repo-server-metrics.argocd.svc.cluster.local:8084", job = "argocd/repo-server" },
          // applicationset-controller (argocd_appset_info)
          { __address__ = "argocd-applicationset-controller-metrics.argocd.svc.cluster.local:8080", job = "argocd/applicationset-controller" }
        ]
        forward_to = [prometheus.remote_write.grafana_cloud_metrics.receiver]
        scrape_interval = "30s"
      }

      // ── Jenkins native metrics ─────────────────────────────
      prometheus.scrape "jenkins_native" {
        targets = [
          { __address__ = "jenkins.jenkins.svc.cluster.local:8080", job = "jenkins/controller" }
        ]
        metrics_path = "/prometheus"
        forward_to = [prometheus.remote_write.grafana_cloud_metrics.receiver]
        scrape_interval = "30s"
      }

      // ── Traefik native metrics ─────────────────────────────
      prometheus.scrape "traefik_native" {
        targets = [
          { __address__ = "traefik-metrics.traefik.svc.cluster.local:9100", job = "traefik" }
        ]
        forward_to = [prometheus.remote_write.grafana_cloud_metrics.receiver]
        scrape_interval = "30s"
      }
