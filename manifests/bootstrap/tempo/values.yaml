tempo:
  retention: 72h
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces

persistence:
  enabled: true
  size: 20Gi

resources:
  requests:
    cpu: 50m
    memory: 200Mi
  limits:
    memory: 1Gi

tolerations:
  - key: "kubernetes.azure.com/scalesetpriority"
    operator: "Equal"
    value: "spot"
    effect: "NoSchedule"
