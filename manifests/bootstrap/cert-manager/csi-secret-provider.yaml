apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  provider: azure
  secretObjects:
  - secretName: cloudflare-api-token-secret
    type: Opaque
    data:
    - key: api-token
      objectName: cloudflare-api-token
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "f94bd843-5f38-4512-8a29-ea97b2459736" # cert-manager workload identity client ID
    keyvaultName: "homelab-kv-etnr"
    cloudName: "AzurePublicCloud"
    objects: |
      array:
        - |
          objectName: cloudflare-api-token
          objectType: secret
          objectVersion: ""
    tenantId: "b8eee1de-0853-417c-9dc9-c90794eb2751"
