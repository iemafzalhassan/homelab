env:
  GF_PLUGINS_ALLOW_LOADING_UNTRUSTED_PLUGINS: "grafana-llm-app"

envFromSecrets:
  - name: grafana-llm-secrets
  - name: grafana-oidc-secret

plugins:
  - grafana-llm-app

grafana.ini:
  server:
    root_url: https://grafana.iemafzalhassan.tech
  plugin.grafana-llm-app:
    openai_url: "https://integrate.api.nvidia.com/v1"
    # openai_api_key will be pulled from GF_PLUGIN_GRAFANA_LLM_APP_OPENAI_API_KEY env var which comes from secret
    openai_mapping: "gpt-4:nvidia/nemotron-4-340b-instruct,gpt-3.5-turbo:nvidia/nemotron-4-340b-instruct,default:nvidia/nemotron-4-340b-instruct"
  auth:
    disable_login_form: false
    oauth_auto_login: false
  auth.generic_oauth:
    enabled: true
    name: "Keycloak"
    allow_sign_up: true
    client_id: "grafana"
    client_secret: "${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}"
    scopes: "openid email profile offline_access roles groups"
    auth_url: "https://sso.iemafzalhassan.tech/realms/Platform/protocol/openid-connect/auth"
    token_url: "https://sso.iemafzalhassan.tech/realms/Platform/protocol/openid-connect/token"
    api_url: "https://sso.iemafzalhassan.tech/realms/Platform/protocol/openid-connect/userinfo"
    tls_skip_verify_insecure: true
    role_attribute_path: "contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'devops') && 'Editor' || 'Viewer'"
    role_attribute_strict: false
    groups_attribute_path: "groups"
    login_attribute_path: "preferred_username"
    name_attribute_path: "name"

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local:80
        access: proxy
        isDefault: true
        uid: grafanacloud-prom
      - name: Loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
        uid: grafanacloud-logs
      - name: Tempo
        type: tempo
        url: http://tempo.monitoring.svc.cluster.local:3100
        access: proxy
        uid: grafanacloud-traces
        jsonData:
          tracesToLogsV2:
            datasourceUid: 'grafanacloud-logs'
            tags: ['job', 'instance', 'pod', 'namespace']
            mapTagNamesEnabled: false
            mapTagNames: {}
            searchAllTime: false
            filterByTraceID: false
            filterBySpanID: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

tolerations:
  - key: "kubernetes.azure.com/scalesetpriority"
    operator: "Equal"
    value: "spot"
    effect: "NoSchedule"

persistence:
  enabled: false

extraObjects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: grafana-oidc-secret
      namespace: monitoring
    type: Opaque
    stringData:
      # Generate a strong secret: openssl rand -base64 32
      # Then store in Keycloak grafana client → Credentials → Client secret
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "8f9JVVT1x6wBKDe4xWPRCFAHqYVWq6Z8"
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: grafana
      namespace: monitoring
    spec:
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
          sectionName: grafana
      hostnames:
        - "grafana.iemafzalhassan.tech"
      rules:
        - backendRefs:
            - name: grafana
              port: 80

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    otel-demo:
      gnetId: null
      datasource: Prometheus
      configMap: grafana-otel-demo-dashboard
