controller:
  jenkinsUrl: "https://jenkins.iemafzalhassan.tech/"
  additionalPlugins:
    - job-dsl
    - prometheus
    - oic-auth
    - matrix-auth
  containerEnv:
    - name: OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: jenkins-oidc-secret
          key: client-secret
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: jenkins-github-token
          key: github-token
  ingress:
    enabled: false
  podLabels:
    azure.workload.identity/use: "true"
  nodeSelector:
    kubernetes.azure.com/scalesetpriority: "spot"
  tolerations:
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"
  serviceAccount:
    create: true
    name: "jenkins"
    annotations:
      azure.workload.identity/client-id: "50a296e5-6b94-42cb-8297-7778ce689fc9"
  JCasC:
    defaultConfig: true
    configScripts:
      credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: "github-token"
                      username: "iemafzalhassan"
                      password: "${GITHUB_TOKEN}"
                      description: "GitHub Token for GitOps updates"
      security: |
        jenkins:
          securityRealm:
            oic:
              clientId: "jenkins"
              clientSecret: "${OIDC_CLIENT_SECRET}"
              serverConfiguration:
                wellKnown:
                  wellKnownOpenIDConfigurationUrl: "https://sso.iemafzalhassan.tech/realms/Platform/.well-known/openid-configuration"
                  scopesOverride: "openid email profile groups"
              userNameField: "preferred_username"
              groupsFieldName: "groups"
              logoutFromOpenidProvider: true
          authorizationStrategy:
            globalMatrix:
              permissions:
                # homelab-admins → full administrator
                - "Overall/Administer:homelab-admins"
                # devops → administer (pipeline config, agent config, credential mgmt)
                - "Overall/Administer:devops"
                # All authenticated users can read overall UI
                - "Overall/Read:authenticated"
                # developers → build, cancel, read jobs; read workspace; view builds
                - "Job/Build:developers"
                - "Job/Cancel:developers"
                - "Job/Read:developers"
                - "Job/Workspace:developers"
                - "Run/Replay:developers"
                - "Run/Update:developers"
                # viewers → read only
                - "Job/Read:viewers"

      prometheus: |
        unclassified:
          prometheusConfiguration:
            defaultNamespace: "jenkins"
      jobs: |
        jobs:
          - script: >
              pipelineJob('sample-build') {
                  definition {
                      cpsScm {
                          scm {
                              git {
                                  remote {
                                      url('https://github.com/iemafzalhassan/homelab.git')
                                  }
                                  branches('*/main')
                              }
                          }
                          scriptPath('Utils/Jenkinsfile')
                      }
                  }
              }
          - script: >
              pipelineJob('homelab-demo') {
                  definition {
                      cpsScm {
                          scm {
                              git {
                                  remote {
                                      url('https://github.com/iemafzalhassan/homelab.git')
                                      credentials('github-token')
                                  }
                                  branches('*/main')
                              }
                          }
                          scriptPath('apps/homelab-demo/Jenkinsfile.demo')
                      }
                  }
              }
          - script: >
              pipelineJob('portfolio-build') {
                  definition {
                      cpsScm {
                          scm {
                              git {
                                  remote {
                                      url('https://github.com/iemafzalhassan/homelab.git')
                                      credentials('github-token')
                                  }
                                  branches('*/main')
                              }
                          }
                          scriptPath('Utils/Jenkinsfile.portfolio')
                      }
                  }
              }

agent:
  enabled: true
  connectTimeout: 300
  podLabels:
    azure.workload.identity/use: "true"
  customJenkinsLabels: "spot"
  nodeSelector:
    kubernetes.azure.com/scalesetpriority: "spot"
  tolerations:
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"
  yamlTemplate: |
    spec:
      tolerations:
        - key: "kubernetes.azure.com/scalesetpriority"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"
  podTemplates:
    kaniko: |
      - name: kaniko
        label: kaniko
        nodeSelector: "kubernetes.azure.com/scalesetpriority=spot"
        yaml: |
          spec:
            tolerations:
              - key: "kubernetes.azure.com/scalesetpriority"
                operator: "Equal"
                value: "spot"
                effect: "NoSchedule"
        containers:
          - name: kaniko
            image: gcr.io/kaniko-project/executor:debug
            command: "/busybox/cat"
            ttyEnabled: true
