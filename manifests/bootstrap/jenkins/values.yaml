controller:
  additionalPlugins:
    - job-dsl
    - prometheus
    - oic-auth
    - matrix-auth
  containerEnv:
    - name: OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: jenkins-oidc-secret
          key: client-secret
  ingress:
    enabled: false
  podLabels:
    azure.workload.identity/use: "true"
  nodeSelector:
    kubernetes.azure.com/scalesetpriority: "spot"
  tolerations:
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"
  serviceAccount:
    create: true
    name: "jenkins"
    annotations:
      azure.workload.identity/client-id: "50a296e5-6b94-42cb-8297-7778ce689fc9"
  JCasC:
    defaultConfig: true
    configScripts:
      security: |
        jenkins:
          securityRealm:
            oic:
              clientId: "jenkins"
              clientSecret: "${OIDC_CLIENT_SECRET}"
              serverConfiguration:
                wellKnown:
                  wellKnownOpenIDConfigurationUrl: "https://sso.smapatticare.com/realms/Platform/.well-known/openid-configuration"
                  scopesOverride: "openid email profile groups"
              userNameField: "preferred_username"
              groupsFieldName: "groups"
              logoutFromOpenidProvider: true
          authorizationStrategy:
            globalMatrix:
              permissions:
                - "Overall/Administer:homelab-admins"
                - "Overall/Read:authenticated"
      prometheus: |
        unclassified:
          prometheusConfiguration:
            defaultNamespace: "jenkins"
      jobs: |
        jobs:
          - script: >
              pipelineJob('sample-build') {
                  definition {
                      cpsScm {
                          scm {
                              git {
                                  remote {
                                      url('https://github.com/iemafzalhassan/homelab.git')
                                  }
                                  branches('*/main')
                              }
                          }
                          scriptPath('Jenkinsfile')
                      }
                  }
              }

agent:
  enabled: true
  connectTimeout: 300
  podLabels:
    azure.workload.identity/use: "true"
  customJenkinsLabels: "spot"
  nodeSelector:
    kubernetes.azure.com/scalesetpriority: "spot"
  tolerations:
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"
  yamlTemplate: |
    spec:
      tolerations:
        - key: "kubernetes.azure.com/scalesetpriority"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"
  podTemplates:
    kaniko: |
      - name: kaniko
        label: kaniko
        nodeSelector: "kubernetes.azure.com/scalesetpriority=spot"
        yaml: |
          spec:
            tolerations:
              - key: "kubernetes.azure.com/scalesetpriority"
                operator: "Equal"
                value: "spot"
                effect: "NoSchedule"
        containers:
          - name: kaniko
            image: gcr.io/kaniko-project/executor:debug
            command: "/busybox/cat"
            ttyEnabled: true
