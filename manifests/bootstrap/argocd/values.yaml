global:
  domain: argocd.smapatticare.com
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Exists"
      effect: "NoSchedule"
  # Adds prometheus.io/scrape annotations to all metrics Services so Alloy
  # annotation-based autodiscovery can also find them. More importantly,
  # this flag causes the Helm chart to CREATE the argocd-metrics (port 8082)
  # and argocd-server-metrics (port 8083) Services in the first place.
  addPrometheusAnnotations: true

server:
  # Run ArgoCD server in insecure mode because Traefik handles TLS termination
  extraArgs:
    - --insecure
  
repoServer:
  serviceAccount:
    create: true
    name: "argocd-repo-server"
    annotations:
      azure.workload.identity/client-id: "c019f6b2-96fd-4a60-914a-7df36bb36939"
      azure.workload.identity/tenant-id: "b8eee1de-0853-417c-9dc9-c90794eb2751"
  podLabels:
    azure.workload.identity/use: "true"
