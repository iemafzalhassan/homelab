global:
  domain: argocd.smapatticare.com
  nodeSelector:
    kubernetes.azure.com/scalesetpriority: "spot"
  tolerations:
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"

configs:
  cm:
    url: https://argocd.smapatticare.com
    oidc.config: |
      name: Keycloak
      issuer: https://sso.smapatticare.com/realms/Platform
      clientID: argocd
      clientSecret: $argocd-oidc-secret:client-secret
      requestedScopes: ["openid", "profile", "email", "groups"]
  rbac:
    policy.csv: |
      g, homelab-admins, role:admin

server:
  # Run ArgoCD server in insecure mode because Traefik handles TLS termination
  extraArgs:
    - --insecure
  metrics:
    # Creates argocd-server-metrics Service on port 8083
    enabled: true

controller:
  metrics:
    # Creates argocd-metrics Service on port 8082 (argocd_app_info lives here)
    enabled: true

repoServer:
  serviceAccount:
    create: true
    name: "argocd-repo-server"
    annotations:
      azure.workload.identity/client-id: "c019f6b2-96fd-4a60-914a-7df36bb36939"
      azure.workload.identity/tenant-id: "b8eee1de-0853-417c-9dc9-c90794eb2751"
  podLabels:
    azure.workload.identity/use: "true"
  metrics:
    # Adds metrics port (8084) to argocd-repo-server Service
    enabled: true

applicationSet:
  metrics:
    # Adds metrics port to argocd-applicationset-controller Service (port 8085)
    enabled: true
