apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: traefik
  annotations:
    azure.workload.identity/client-id: "fea8dd93-be15-4804-a790-b200eda1bae5"
  labels:
    azure.workload.identity/use: "true"
---
apiVersion: v1
kind: Pod
metadata:
  name: akv-test-pod
  namespace: traefik
  labels:
    azure.workload.identity/use: "true"
spec:
  serviceAccountName: traefik
  containers:
    - name: test
      image: alpine
      command:
        - "sleep"
        - "10000"
      volumeMounts:
        - name: secrets-store01-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Exists"
  volumes:
    - name: secrets-store01-inline
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "azure-kvname-user-msi"
