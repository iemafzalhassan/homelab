  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "fea8dd93-be15-4804-a790-b200eda1bae5" # Traefik User-Assigned Managed Identity Client ID
    keyvaultName: "homelab-kv-etnr"
    cloudName: ""
