apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opentelemetry-demo-frontend
  namespace: otel-demo
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
  hostnames:
  - "shop.iemafzalhassan.tech"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend-proxy
      port: 8080
