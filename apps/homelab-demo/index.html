<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homelab Demo Application</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #0d0e12;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
        }
        h1 {
            color: #a855f7;
            margin-bottom: 8px;
        }
        p {
            color: #94a3b8;
        }
        .badge {
            background-color: #1e1b4b;
            color: #c084fc;
            padding: 6px 12px;
            border-radius: 9999px;
            font-family: monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Homelab AKS Platform</h1>
        <p>Dynamic GitOps Promotion Demo Application</p>
        <p>Active Version: <span class="badge">VERSION_PLACEHOLDER</span></p>
    </div>
</body>
</html>
