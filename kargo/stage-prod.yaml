apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: microservices-demo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: microservices-demo
      sources:
        stages:
          - uat
  promotionTemplate:
    spec:
      steps:
        - uses: argocd-update
          config:
            apps:
              - name: microservices-demo-prod
                namespace: argocd