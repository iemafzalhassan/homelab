apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: uat
  namespace: microservices-demo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: microservices-demo
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - uses: argocd-update
          config:
            apps:
              - name: microservices-demo-uat
                namespace: argocd